<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline - Barangay 178 Safety Campaign</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #f3f4f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .icon svg {
      width: 40px;
      height: 40px;
      color: #6b7280;
    }
    
    h1 {
      color: #1f2937;
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    p {
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    
    .campaigns-available {
      background: #f9fafb;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
    }
    
    .campaigns-available h3 {
      color: #374151;
      font-size: 16px;
      margin-bottom: 10px;
    }
    
    .campaigns-available ul {
      list-style: none;
      padding: 0;
    }
    
    .campaigns-available li {
      color: #6b7280;
      padding: 8px 0;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .campaigns-available li:last-child {
      border-bottom: none;
    }
    
    .campaigns-available li::before {
      content: "📢";
    }
    
    .retry-button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .retry-button:hover {
      background: #5568d3;
    }
    
    .info-text {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
      </svg>
    </div>
    
    <h1>You're Offline</h1>
    <p>No internet connection detected. Don't worry - you can still access cached safety campaigns!</p>
    
    <div class="campaigns-available">
      <h3>Available Offline Campaigns</h3>
      <ul id="cached-campaigns">
        <li>Loading cached campaigns...</li>
      </ul>
    </div>
    
    <button class="retry-button" onclick="window.location.reload()">
      Try Reconnecting
    </button>
    
    <p class="info-text">
      Emergency contacts are still available even offline.<br>
      Call Barangay Emergency Hotline: 123-4567
    </p>
  </div>

  <script>
    // Get cached campaigns from service worker
    if ('serviceWorker' in navigator) {
      const channel = new MessageChannel();
      
      navigator.serviceWorker.controller.postMessage({
        type: 'GET_CACHED_CAMPAIGNS'
      }, [channel.port1]);
      
      channel.port2.onmessage = (event) => {
        const campaignIds = event.data.campaignIds || [];
        const list = document.getElementById('cached-campaigns');
        
        if (campaignIds.length === 0) {
          list.innerHTML = '<li>No campaigns cached for offline use</li>';
        } else {
          list.innerHTML = campaignIds.map(id => 
            `<li>Campaign #${id}</li>`
          ).join('');
        }
      };
    }
  </script>
</body>
</html>
