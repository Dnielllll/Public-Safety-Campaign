events {
    worker_connections 1024;
}

http {
    # ─── Upstream service definitions ────────────────────────────────────────
    upstream auth_service {
        server auth-service:9000;
    }

    upstream campaign_service {
        server campaign-service:9000;
    }

    upstream content_service {
        server content-service:9000;
    }

    upstream workflow_service {
        server workflow-service:9000;
    }

    upstream notification_service {
        server notification-service:3001;
    }

    # ─── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=sms_limit:10m rate=10r/m;

    # ─── Main server block ────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Global CORS headers
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;

        # Handle pre-flight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location = /health {
            return 200 '{"status":"ok","gateway":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # ── Auth Service: /api/auth/* ─────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/auth/(.*)$ /api/$1 break;

            proxy_pass         http://auth_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Campaign Service: /api/campaigns/* ───────────────────────────────
        location /api/campaigns/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/campaigns/(.*)$ /api/campaigns/$1 break;

            proxy_pass         http://campaign_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Content Service: /api/contents/* ─────────────────────────────────
        location /api/contents/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/contents/(.*)$ /api/contents/$1 break;

            proxy_pass         http://content_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Workflow Service: /api/workflow/* ─────────────────────────────────
        location /api/workflow/ {
            limit_req zone=api_limit burst=10 nodelay;

            rewrite ^/api/workflow/(.*)$ /api/workflow/$1 break;

            proxy_pass         http://workflow_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Notification Service: /api/notifications/* ────────────────────────
        location /api/notifications/ {
            limit_req zone=sms_limit burst=5 nodelay;

            rewrite ^/api/notifications/(.*)$ /$1 break;

            proxy_pass         http://notification_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;  # SMS bulk send can take time
        }

        # ── Fallback 404 ─────────────────────────────────────────────────────
        location / {
            return 404 '{"error":"Route not found. Use /api/<service>/<path>"}';
            add_header Content-Type application/json;
        }
    }
}
