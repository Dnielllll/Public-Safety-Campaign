version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
#  Barangay 178 Safety Campaign System — Microservices Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
#
#  Services:
#    api-gateway          → Nginx reverse proxy  (port 8080)
#    auth-service         → Laravel Auth API     (internal: 8001 → FPM 9000)
#    campaign-service     → Laravel Campaigns    (internal: 8002 → FPM 9000)
#    content-service      → Laravel Content      (internal: 8003 → FPM 9000)
#    workflow-service     → Laravel Workflow     (internal: 8004 → FPM 9000)
#    notification-service → Node.js SMS/Notify   (internal: 3001)
#    frontend             → React SPA (Nginx)    (port 3000)
#    postgres             → PostgreSQL 15        (port 5432)
#    redis                → Redis 7              (port 6379)
#
#  All Laravel services are built from the repo root (context: .)
#  so that Dockerfiles can COPY from both backend/ and services/<name>/.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: pg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-superteamdaniel12345}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campaign-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campaign-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - campaign-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── API Gateway ─────────────────────────────────────────────────────────────

  api-gateway:
    image: nginx:alpine
    container_name: campaign-api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./services/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - campaign-service
      - content-service
      - workflow-service
      - notification-service
    networks:
      - campaign-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Auth Service ────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: campaign-auth-svc
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:8001
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-superteamdaniel12345}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:5173,localhost:3000}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
    volumes:
      - auth_storage:/var/www/html/storage
      - auth_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campaign-network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Campaign Service ────────────────────────────────────────────────────────

  campaign-service:
    build:
      context: .
      dockerfile: services/campaign-service/Dockerfile
    container_name: campaign-campaign-svc
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:8002
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-superteamdaniel12345}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:5173,localhost:3000}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
    volumes:
      - campaign_storage:/var/www/html/storage
      - campaign_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campaign-network

  # ── Content Service ─────────────────────────────────────────────────────────

  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    container_name: campaign-content-svc
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:8003
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-superteamdaniel12345}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:5173,localhost:3000}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
    volumes:
      - content_storage:/var/www/html/storage
      - content_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campaign-network

  # ── Workflow Service ────────────────────────────────────────────────────────

  workflow-service:
    build:
      context: .
      dockerfile: services/workflow-service/Dockerfile
    container_name: campaign-workflow-svc
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:8004
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-superteamdaniel12345}
      SUPABASE_URL: ${SUPABASE_URL:-https://zuuwqrxmkeryzbcrlrai.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
    volumes:
      - workflow_storage:/var/www/html/storage
      - workflow_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campaign-network

  # ── Notification Service ────────────────────────────────────────────────────

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: campaign-notification-svc
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IPROG_API_TOKEN: ${IPROG_API_TOKEN}
      SEMAPHORE_API_KEY: ${SEMAPHORE_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: "*"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - campaign-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frontend ────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campaign-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://zuuwqrxmkeryzbcrlrai.supabase.co}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      VITE_API_GATEWAY_URL: http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - campaign-network

# ─── Networks ────────────────────────────────────────────────────────────────

networks:
  campaign-network:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  auth_storage:
    driver: local
  auth_cache:
    driver: local
  campaign_storage:
    driver: local
  campaign_cache:
    driver: local
  content_storage:
    driver: local
  content_cache:
    driver: local
  workflow_storage:
    driver: local
  workflow_cache:
    driver: local
