name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Lint frontend
      working-directory: ./frontend
      run: npm run lint
    
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  backend-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, pdo, pdo_pgsql
        coverage: xdebug
        tools: composer:v2
    
    - name: Copy environment file
      working-directory: ./backend
      run: cp .env.example .env
    
    - name: Install backend dependencies
      working-directory: ./backend
      run: composer install --prefer-dist --no-progress --no-interaction
    
    - name: Generate application key
      working-directory: ./backend
      run: php artisan key:generate
    
    - name: Run tests
      working-directory: ./backend
      run: php artisan test
    
    - name: Run Pint (Laravel Pint)
      working-directory: ./backend
      run: ./vendor/bin/pint --test

  snyk-security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        working-directory: frontend
    
    - name: Run Snyk for PHP
      uses: snyk/actions/php@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        working-directory: backend

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test, snyk-security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend Docker image
      run: docker build -t public-campaign-backend ./backend
    
    - name: Build frontend Docker image
      run: docker build -t public-campaign-frontend ./frontend
